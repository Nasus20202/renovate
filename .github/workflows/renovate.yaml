name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level for Renovate"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR
          - FATAL

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: get_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.get_token.outputs.token }}

      - name: Cache Renovate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-${{ runner.os }}

      - name: Prepare Renovate directories
        run: |
          mkdir -p /tmp/renovate/cache /tmp/renovate/repos
          sudo chmod -R 777 /tmp/renovate

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          configurationFile: renovate.config.js
          token: ${{ steps.get_token.outputs.token }}
          renovate-version: 44.182.2
        env:
          RENOVATE_CACHE_DIR: /tmp/renovate/cache
          RENOVATE_GHCR_USERNAME: x-access-token
          RENOVATE_GHCR_TOKEN: ${{ secrets.RENOVATE_GHCR_TOKEN }}
          RENOVATE_DOCKERHUB_USERNAME: ${{ secrets.RENOVATE_DOCKERHUB_USERNAME }}
          RENOVATE_DOCKERHUB_TOKEN: ${{ secrets.RENOVATE_DOCKERHUB_TOKEN }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'INFO' }}
