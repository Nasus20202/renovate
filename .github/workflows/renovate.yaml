name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level for Renovate"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR
          - FATAL

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get_token.outputs.token }}

      - name: Cache Renovate
        uses: actions/cache@v6
        with:
          path: /tmp/renovate/cache
          key: renovate-cache-${{ runner.os }}

      - name: Prepare Renovate directories
        run: |
          mkdir -p /tmp/renovate/cache /tmp/renovate/repos
          sudo chmod -R 777 /tmp/renovate

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          configurationFile: renovate.config.js
          token: ${{ steps.get_token.outputs.token }}
          renovate-version: 44.23.0
        env:
          RENOVATE_CACHE_DIR: /tmp/renovate/cache
          RENOVATE_GHCR_USERNAME: x-access-token
          RENOVATE_GHCR_PASSWORD: ${{ secrets.RENOVATE_GHCR_TOKEN }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'INFO' }}
