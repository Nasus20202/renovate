name: Validate Renovate config

on:
  pull_request:
    paths:
      - renovate.json
      - renovate.config.js
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Read runner version from renovate workflow
        id: runner
        run: |
          version=$(grep 'renovate-version' .github/workflows/renovate.yaml | cut -d: -f2 | tr -d ' \t')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate renovate.json
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate-config-validator renovate.json

      - name: Validate renovate.config.js
        # The config reads registry credentials from env. Placeholders are
        # enough for validation; the real values only exist in the runner.
        env:
          RENOVATE_GHCR_USERNAME: placeholder
          RENOVATE_GHCR_PASSWORD: placeholder
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate-config-validator renovate.config.js

      - name: Resolve config presets
        env:
          RENOVATE_CONFIG_FILE: renovate.config.js
          RENOVATE_GHCR_USERNAME: placeholder
          RENOVATE_GHCR_PASSWORD: placeholder
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate --platform=local --print-config > /dev/null
