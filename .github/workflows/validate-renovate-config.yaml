name: Validate Renovate config

on:
  pull_request:
    paths:
      - default.json
      - renovate.json
      - renovate.config.js
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Read runner version from renovate workflow
        id: runner
        run: |
          version=$(grep 'renovate-version' .github/workflows/renovate.yaml | cut -d: -f2 | tr -d ' \t')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate default.json
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate-config-validator default.json

      - name: Validate renovate.json
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate-config-validator renovate.json

      - name: Validate renovate.config.js
        env:
          RENOVATE_GHCR_USERNAME: placeholder
          RENOVATE_GHCR_PASSWORD: placeholder
        run: npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate-config-validator renovate.config.js

      - name: Resolve shared preset
        run: |
          jq '{extends: .extends}' default.json > "$RUNNER_TEMP/presets.json"
          RENOVATE_CONFIG_FILE="$RUNNER_TEMP/presets.json" npx --yes -p renovate@${{ steps.runner.outputs.version }} renovate --platform=local --print-config > /dev/null